name: Configure Worker secrets (one-off handshake)

# 1) generates an RSA key pair in memory and publishes ONLY the public key to this branch
# 2) waits for values encrypted to that key (crew key, Make URL), decrypts them in memory
# 3) creates a Realtime SFU app + TURN key via the Cloudflare API (if the token allows)
# 4) uploads everything as Worker secrets with wrangler, writes a values-free status report

on:
  push:
    branches: [claude/fetch-design-assets]
    paths: ['.github/workflows/mirror-design.yml']

permissions:
  contents: write

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Handshake and configure
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          K=$(mktemp -d)   # private key lives only here, on the runner
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out $K/priv.pem 2>/dev/null
          mkdir -p _handshake
          openssl pkey -in $K/priv.pem -pubout -out _handshake/pub.pem
          git add _handshake/pub.pem && git commit -qm "handshake: public key" && git push -q origin HEAD:claude/fetch-design-assets
          echo "waiting for encrypted values…"
          for i in $(seq 1 120); do
            git pull -q --rebase origin claude/fetch-design-assets || true
            [ -f _handshake/CREW_KEY.enc ] && break
            sleep 10
          done
          REPORT=_handshake/report.txt; : > $REPORT
          dec() { [ -f "_handshake/$1.enc" ] && base64 -d "_handshake/$1.enc" | openssl pkeyutl -decrypt -inkey $K/priv.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 2>/dev/null; }
          CREW_KEY=$(dec CREW_KEY || true); MAKE_WEBHOOK_URL=$(dec MAKE_WEBHOOK_URL || true)
          [ -n "$CREW_KEY" ] && echo "::add-mask::$CREW_KEY"; [ -n "$MAKE_WEBHOOK_URL" ] && echo "::add-mask::$MAKE_WEBHOOK_URL"
          echo "crew_key_received=$([ -n "$CREW_KEY" ] && echo yes || echo no)" >> $REPORT
          echo "make_url_received=$([ -n "$MAKE_WEBHOOK_URL" ] && echo yes || echo no)" >> $REPORT
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID
          H=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          echo "token_verify=$(curl -s "${H[@]}" "$API/tokens/verify" | jq -c '{success, errors: [.errors[]?.code]}') user_verify=$(curl -s "${H[@]}" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '{success}')" >> $REPORT
          # Realtime SFU app: reuse one named gtrpht-live if it exists
          APPS=$(curl -s "${H[@]}" "$API/calls/apps")
          echo "list_apps=$(echo "$APPS" | jq -c '{success, n: (.result|length?), errors: [.errors[]?|{code,message}]}')" >> $REPORT
          NEW=$(curl -s -X POST "${H[@]}" "$API/calls/apps" -d '{"name":"gtrpht-live"}')
          RT_ID=$(echo "$NEW" | jq -r '.result.uid // empty'); RT_SECRET=$(echo "$NEW" | jq -r '.result.secret // empty')
          [ -n "$RT_SECRET" ] && echo "::add-mask::$RT_SECRET"
          echo "create_app=$(echo "$NEW" | jq -c '{success, errors: [.errors[]?|{code,message}]}')" >> $REPORT
          TK=$(curl -s -X POST "${H[@]}" "$API/calls/turn_keys" -d '{"name":"gtrpht-turn"}')
          TURN_ID=$(echo "$TK" | jq -r '.result.uid // empty'); TURN_TOKEN=$(echo "$TK" | jq -r '.result.key // empty')
          [ -n "$TURN_TOKEN" ] && echo "::add-mask::$TURN_TOKEN"
          echo "create_turn=$(echo "$TK" | jq -c '{success, errors: [.errors[]?|{code,message}]}')" >> $REPORT
          CREW_KEY="$CREW_KEY" MAKE_WEBHOOK_URL="$MAKE_WEBHOOK_URL" REALTIME_APP_ID="$RT_ID" REALTIME_APP_SECRET="$RT_SECRET" TURN_KEY_ID="$TURN_ID" TURN_KEY_TOKEN="$TURN_TOKEN" \
            node -e 'const o={};for(const n of ["CREW_KEY","MAKE_WEBHOOK_URL","REALTIME_APP_ID","REALTIME_APP_SECRET","TURN_KEY_ID","TURN_KEY_TOKEN"]) if(process.env[n]) o[n]=process.env[n]; require("fs").writeFileSync(process.argv[1], JSON.stringify(o)); console.log("keys: "+Object.keys(o).join(","));' $K/s.json >> $REPORT
          mkdir -p $K/w && cd $K/w && npm init -y >/dev/null && npm i -s wrangler@4 >/dev/null 2>&1
          npx wrangler secret bulk $K/s.json --name gtrpht-live-hub > $K/bulk.log 2>&1; echo "wrangler_bulk_exit=$?" >> $GITHUB_WORKSPACE/$REPORT
          grep -iE "success|error|✘|uploaded|finished" $K/bulk.log | sed -E 's/[A-Za-z0-9_-]{30,}/***/g' | head -20 >> $GITHUB_WORKSPACE/$REPORT
          cd $GITHUB_WORKSPACE
          sleep 8
          echo "health_after=$(curl -sS -m 20 https://bangtaostyle.com/api/health)" >> $REPORT
          rm -rf $K
          git rm -q --cached _handshake/*.enc 2>/dev/null; rm -f _handshake/*.enc
          git add -A _handshake && git commit -qm "handshake: report (no secret values)" && git push -q origin HEAD:claude/fetch-design-assets
          cat $REPORT
