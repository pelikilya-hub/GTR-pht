name: Fetch photos (cars, drones, story)

on:
  push:
    branches: [claude/fetch-design-assets]
    paths: ['.github/workflows/mirror-design.yml', '.github/scripts/commons_photos.py']

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 .github/scripts/commons_photos.py _photos2
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -f _photos2 && git commit -qm "photos: cars, drones, story" && git push -q origin HEAD:claude/fetch-design-assets
