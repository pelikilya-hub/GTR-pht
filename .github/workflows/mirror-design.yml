name: Probe production player

on:
  push:
    branches: [claude/fetch-design-assets]
    paths: ['.github/workflows/mirror-design.yml', '.github/scripts/probe.mjs']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.56.1 >/dev/null && true
      - run: node .github/scripts/probe.mjs
      - name: Commit results (public data only)
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -f _probe && git commit -qm "player probe" && git push -q origin HEAD:claude/fetch-design-assets
