name: Fetch city photos (one-off)

on:
  push:
    branches: [claude/fetch-design-assets]

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download free-licensed city photos from Wikimedia Commons
        run: python3 .github/scripts/commons_photos.py _photos
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -f _photos
          git commit -m "city photos from Wikimedia Commons" || echo "nothing to commit"
          git push origin HEAD:claude/fetch-design-assets
